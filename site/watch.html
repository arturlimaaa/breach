<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Breach watch</title>
<link rel="stylesheet" href="styles.css">
<body class="watch">
<iframe id="viewer" title="Bot viewer"></iframe>
<main>
  <p>Run <code id="run"></code>, read from <code>runs/&lt;run&gt;/</code>.</p>
  <h2>Status</h2>
  <div id="status">Loading.</div>
  <h2>Steps</h2>
  <div id="log">Loading.</div>
</main>
<script src="app.js"></script>
<script>
const query = new URLSearchParams(location.search);
// The adapter's viewer is the one thing this site loads from another origin.
$('viewer').src = query.get('viewer') || 'http://127.0.0.1:3007';
// live.py names the log after the task id and writes manifest.json only when the episode ends.
const logName = async () => `${query.get('episode') || (await load('manifest.json'))?.episodes?.[0]?.id || 't1'}.jsonl`;
// The banner's class for the same outcome, so a verdict has the banner's color.
const TONE = { match: 'certified', mismatch: 'demoted', quarantined: 'revising' };
// A line still being written does not parse yet; the next poll shows it.
const parse = line => { try { return JSON.parse(line); } catch { return null; } };

function steps(name, text) {
  const all = text.split('\n').map(parse).filter(Boolean);
  const rows = all.slice(-30).reverse().map(t => `<tr class="${t.test ? 'test' : ''}"><td>${num(t.step)}</td>`
    + `<td>${esc(t.action)} ${esc(t.target)}${t.test ? ' <span class="tag">test</span>' : ''}</td>`
    + `<td>${esc(delta(t.predicted)) || '–'}</td><td>${esc(delta(t.observed)) || '–'}</td>`
    + `<td class="${TONE[t.verdict] ?? ''}">${esc(t.verdict)}</td></tr>`);
  return `<p><code>${esc(name)}</code>: ${all.length} steps, newest first.</p>
<table class="steps"><thead><tr><th>step</th><th>action</th><th>predicted</th><th>observed</th><th>verdict</th></tr></thead>
<tbody>${rows.join('')}</tbody></table>`;
}

async function tick() {
  const [status, name] = await Promise.all([load('status.json'), logName()]);
  section('status', status, 'status.json', plan, '<p class="missing">No status yet.</p>');
  // A plan is longer than its pane; keep the step being run in view.
  $('status').querySelector('.current')?.scrollIntoView({ block: 'nearest' });
  section('log', await load(name, 'text'), name, text => steps(name, text), `<p class="missing">No steps yet in <code>${esc(name)}</code>.</p>`);
}

$('run').textContent = run;
tick();
setInterval(tick, 1000);
</script>
</html>
